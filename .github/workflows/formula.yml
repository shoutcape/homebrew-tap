name: Formula

on:
  push:
    paths:
      - Formula/**/*.rb
  pull_request:
    paths:
      - Formula/**/*.rb

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - run: brew tap shoutcape/tap "$GITHUB_WORKSPACE"
      - run: brew style --formula shoutcape/tap/treeman
      - run: brew audit --strict --formula shoutcape/tap/treeman

  test:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - run: brew update
      - run: brew install shoutcape/tap/treeman
      - run: brew test shoutcape/tap/treeman
      - run: treeman version
